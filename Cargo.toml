[package]
name = "moodle-mcp"
version = "0.1.1"
edition = "2021"
description = "Servidor MCP y CLI para Moodle"
repository = "https://github.com/robertofabiot/moodle-mcp"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-std", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }   # sin "cookies"
mime_guess = "2"
htmd = "0.6"
pulldown-cmark = "0.13"
tempfile = "3"
percent-encoding = "2"
base64 = "0.23"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
thiserror = "2.0.21"
anyhow = "1.0.104"

clap = { version = "4.6", features = ["derive", "env"] }
rpassword = "7.5"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
dirs = "7"
url = "2.5"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
schemars = "1"
scraper = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6.5"
tempfile = "3"
rmcp = { version = "3.11", features = ["client", "server", "macros", "transport-io"] }

[[bin]]
name = "moodle-mcp"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
